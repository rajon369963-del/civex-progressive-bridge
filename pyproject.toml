[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civex-progressive-bridge"
version = "0.1.0"
description = "Sub-50µs progressive tool disclosure engine for LLMs with 5,000+ tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Rajon Das", email = "lakhidas168@gmail.com"}
]
keywords = ["agentic-ai", "tool-calling", "llm", "sqlite-fts5", "context-compression", "prompt-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rajon369963-del/civex-progressive-bridge"
Repository = "https://github.com/rajon369963-del/civex-progressive-bridge"

[project.scripts]
civex-bridge = "civex.bridge:main"
