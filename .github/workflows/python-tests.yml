name: CIVEX Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AIR10_EXEC_BOUNDARY: /tmp/air10_exec_boundary

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -e .

    - name: Compile & Smoke Test C11 Execution Boundary
      run: |
        cc -O3 -std=c11 civex/trace_plumbing/air10_exec_boundary.c -o /tmp/air10_exec_boundary
        chmod +x /tmp/air10_exec_boundary
        /tmp/air10_exec_boundary "tr_ci_smoke" "span_root" /bin/echo /dev/null

    - name: Run Master Regression Suite
      run: |
        pytest tests/

    - name: Smoke Test CLI Entrypoint
      run: |
        civex-bridge search "git" --limit 2
        civex-bridge hydrate "tool_git_commit"

    - name: Verify Host-Isolated Wheel Build & Portability
      run: |
        python -m pip install build
        python -m build
        TEST_DIR=$(mktemp -d)
        python -m venv "$TEST_DIR/venv"
        "$TEST_DIR/venv/bin/pip" install dist/*.whl
        (
          cd "$TEST_DIR"
          HOME="$TEST_DIR/fake_home" "$TEST_DIR/venv/bin/civex-bridge" search "git" --limit 2
          HOME="$TEST_DIR/fake_home" "$TEST_DIR/venv/bin/civex-bridge" hydrate "tool_git_commit"
          HOME="$TEST_DIR/fake_home" "$TEST_DIR/venv/bin/python" -c "import os; from civex.bridge import ProgressiveToolBridge; b = ProgressiveToolBridge(); print('CI Loaded DB:', b.db_path); assert 'site-packages/civex/data/sample_catalog.sqlite' in b.db_path, f'Failed bundled path check: {b.db_path}'; print('CI HOST-ISOLATED WHEEL PORTABILITY CONFIRMED')"
        )
        rm -rf "$TEST_DIR"
