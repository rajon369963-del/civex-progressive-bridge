name: CIVEX Autonomous Showcase & Test Circuit
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    env:
      AIR10_EXEC_BOUNDARY: /tmp/air10_exec_boundary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio cryptography
          pip install -e .
      - name: Compile C11 Execution Boundary
        shell: bash
        run: |
          cc -O3 -std=c11 civex/trace_plumbing/air10_exec_boundary.c -o /tmp/air10_exec_boundary
          chmod +x /tmp/air10_exec_boundary
      - name: Run Court & Bridge Invariant Tests
        shell: bash
        run: |
          pytest tests/ -v
      - name: Run Browser JavaScript Okapi BM25 Execution Tests via Node.js
        shell: bash
        run: |
          node tests/test_browser_bm25_execution.mjs
      - name: Verify Hosted Zero-Install Demo Semantic Identity
        shell: bash
        run: |
          python3 scripts/verify_public_demo_identity.py \
            --url "https://rajon369963-del.github.io/civex-progressive-bridge/" \
            --source index.html \
            --marker "CIVEX CANONICAL OKAPI BM25 ROUTER" \
            --marker "executeRealRouting" \
            --marker "tool_git_commit_and_push"
      - name: Execute Standalone Okapi BM25 Benchmark Reproducer
        shell: bash
        run: |
          python3 scripts/run_benchmark_with_tombstone.py \
            --repo "rajon369963-del/civex-progressive-bridge" \
            --benchmark-cmd "python3 scripts/benchmark_civex_routing.py" \
            --expected-output "scripts/civex_benchmark_results.json" \
            --status-output "scripts/benchmark_status.json" \
            --stdout-log "scripts/benchmark_stdout.log" \
            --stderr-log "scripts/benchmark_stderr.log"

      - name: Upload Live Benchmark Artifact (Preserve Evidence Even on Failure)
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: live-civex-benchmark-results
          path: |
            scripts/civex_benchmark_results.json
            scripts/benchmark_status.json
            scripts/benchmark_stdout.log
            scripts/benchmark_stderr.log
          if-no-files-found: error
          retention-days: 90

      - name: Run Permanent Adversarial Canary Regression Suite
        shell: bash
        run: |
          python3 tests/test_adversarial_receipt_canaries.py

      - name: Verify Cryptographic Receipt & Scorecard Zero-Drift
        shell: bash
        run: |
          set -o pipefail
          set +e
          python3 scripts/verify_receipt.py --assert-live-benchmark scripts/civex_benchmark_results.json 2>&1 | tee /tmp/civex_forensic_verification_report.txt
          verifier_rc=${PIPESTATUS[0]}
          printf '\nVERIFIER_EXIT_CODE=%s\n' "$verifier_rc" | tee -a /tmp/civex_forensic_verification_report.txt
          exit "$verifier_rc"

      - name: Run Directional Federation Lineage Freshness & Hostile Courts
        shell: bash
        run: |
          python3 tests/test_federation_manifest_hostile_court.py

      - name: Verify Federation Evidence Manifest
        shell: bash
        run: |
          python3 scripts/verify_federation_manifest.py --verify federation-evidence-manifest.json --repo civex-progressive-bridge --authority-context auto --live-provider

      - name: Upload Forensic Verification Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: civex-forensic-verification-report
          path: /tmp/civex_forensic_verification_report.txt
          if-no-files-found: error
          retention-days: 90
