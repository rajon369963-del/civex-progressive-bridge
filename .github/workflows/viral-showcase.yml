name: CIVEX Autonomous Showcase & Test Circuit
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    env:
      AIR10_EXEC_BOUNDARY: /tmp/air10_exec_boundary
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e .
      - name: Compile C11 Execution Boundary
        run: |
          cc -O3 -std=c11 civex/trace_plumbing/air10_exec_boundary.c -o /tmp/air10_exec_boundary
          chmod +x /tmp/air10_exec_boundary
      - name: Run Court & Bridge Invariant Tests
        run: |
          pytest tests/ -v
