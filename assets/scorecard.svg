<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="900" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="20" y="20" width="860" height="4" fill="url(#cyan-grad)" rx="2"/>
  
  <text x="40" y="55" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">CIVEX PROGRESSIVE BRIDGE • LIVE VERIFIED PERFORMANCE BENCHMARK</text>
  <text x="40" y="85" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">5,283 Tools Compressed &lt;= 249B with Sub-Millisecond JIT Hydration</text>

  <!-- Metric 1 -->
  <g transform="translate(40, 115)">
    <rect width="250" height="130" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Routing Latency</text>
    <text x="20" y="75" fill="#00f2fe" font-family="monospace" font-size="34" font-weight="800" filter="url(#glow)">0.28 ms</text>
    <text x="20" y="105" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">⚡ SQLite FTS5 BM25 Engine</text>
  </g>

  <!-- Metric 2 -->
  <g transform="translate(320, 115)">
    <rect width="250" height="130" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Context Compression</text>
    <text x="20" y="75" fill="#fbbf24" font-family="monospace" font-size="34" font-weight="800">375x</text>
    <text x="20" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">450k &rarr; 1,200 tokens/turn</text>
  </g>

  <!-- Metric 3 -->
  <g transform="translate(600, 115)">
    <rect width="250" height="130" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Court Invariants</text>
    <text x="20" y="75" fill="#10b981" font-family="monospace" font-size="34" font-weight="800">24/24</text>
    <text x="20" y="105" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">✓ HMAC Signed Permits (G1-33)</text>
  </g>

  <!-- Footer -->
  <text x="40" y="285" fill="#64748b" font-family="sans-serif" font-size="12">Verified on Apple Silicon M1 (ARM64) • Zero Memory Leaks • POSIX flock Safe • 100% Free Open Source (MIT)</text>
</svg>
